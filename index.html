*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:700}

.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.card h2{font-size:16px;margin:0 0 8px}
.mute{color:var(--mute);font-size:13px}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn.sec{background:#e8ebf7;color:var(--pri)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:#eef0fb}
.opt.right{border-color:var(--ok);background:#e8f6ef}
.opt.wrong{border-color:var(--bad);background:#fdeded}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;font-size:11px;color:var(--mute)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.bar{height:10px;background:#e8ebf3;border-radius:6px;overflow:hidden}

.big{font-size:44px;font-weight:800;color:var(--pri);line-height:1}
.tag{display:inline-block;background:#e8ebf7;color:var(--pri);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
textarea,input[type=text],input[type=password]{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.w-ok{background:#d9f2e5;border-radius:5px;padding:0 3px}.w-bad{background:#fbdcdc;border-radius:5px;padding:0 3px;text-decoration:line-through}
.rec{width:78px;height:78px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(214,69,69,.4)}
.rec.live{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.5)}100%{box-shadow:0 0 0 22px rgba(214,69,69,0)}}
ul.fb{padding-left:18px;margin:6px 0}
ul.fb li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.center{text-align:center}
.ai{border-left:4px solid var(--pri);background:#f3f5ff;border-radius:10px;padding:10px 12px;margin-top:10px}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEF={name:'',placed:false,lv:{vocab:1,listen:1,speak:1,write:1},srs:{},hist:[],apiKey:'',model:'gemini-2.5-flash',streak:0,last:'',xp:0,seen:{}};
let S=load();
function load(){try{const o=JSON.parse(localStorage.getItem('thpt_english_ai')||'{}');return Object.assign(JSON.parse(JSON.stringify(DEF)),o)}catch(e){return JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem('thpt_english_ai',JSON.stringify(S))}catch(e){}}
const lvl=k=>Math.max(1,Math.min(3,Math.floor(S.lv[k])));
const dayStr=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
function touchStreak(){const t=dayStr(Date.now());if(S.last===t)return;const y=dayStr(Date.now()-864e5);S.streak=(S.last===y)?S.streak+1:1;S.last=t}
function record(skill,score){
  S.lv[skill]=Math.max(1,Math.min(3.99,S.lv[skill]+(score-0.6)*0.5));
  S.hist.push({t:Date.now(),skill,score:Math.round(score*100)/100,lv:lvl(skill)});
  S.hist=S.hist.slice(-300);S.xp+=Math.round(score*10)+2;touchStreak();save();
}
function recentAvg(skill){const h=S.hist.filter(x=>x.skill===skill).slice(-5);return h.length?h.reduce((a,b)=>a+b.score,0)/h.length:null}
function pick(arr,key){ // chọn bài chưa làm gần đây
  const seen=S.seen[key]||[];let pool=arr.filter(x=>!seen.includes(arr.indexOf(x)));
  if(!pool.length){S.seen[key]=[];pool=arr}
  const it=pool[Math.floor(Math.random()*pool.length)];
  S.seen[key]=(S.seen[key]||[]).concat(arr.indexOf(it));save();return it;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ============ Giọng đọc / micro ============ */
function speak(text,rate){
  if(!('speechSynthesis' in window)){toast('Thiết bị không hỗ trợ đọc giọng nói');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||1;
  const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  if(v)u.voice=v;speechSynthesis.speak(u);
}
let rec=null;
function setRecUI(on){const b=$('#recbtn');if(!b)return;b.classList.toggle('live',on);b.textContent=on?'⏹':'🎤';const s=$('#recst');if(s)s.textContent=on?'Đang nghe... bấm để dừng':'Bấm micro để nói'}
function toggleRec(){
  if(rec){try{rec.stop()}catch(e){}rec=null;return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Thiết bị chưa hỗ trợ nhận giọng nói. Hãy gõ nội dung bạn nói vào ô bên dưới.');return}
  const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=true;
  let fin=$('#tx').value?$('#tx').value.trim()+' ':'';
  r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript+' ';else it+=x[0].transcript}$('#tx').value=fin+it};
  r.onerror=e=>{toast('Lỗi micro: '+e.error+(e.error==='not-allowed'?' (hãy cấp quyền micro)':''));rec=null;setRecUI(false)};
  r.onend=()=>{rec=null;setRecUI(false)};
  try{r.start();rec=r;setRecUI(true)}catch(e){toast('Không bật được micro')}
}

/* ============ AI chấm điểm (tuỳ chọn, dùng khoá Gemini của bạn) ============ */
async function aiGrade(kind,task,answer,lv){
  if(!S.apiKey)return null;
  const guide={speak:'bài NÓI (lời nói đã được chuyển thành văn bản nên đừng trừ điểm chính tả/dấu câu; đánh giá phát âm gián tiếp qua từ bị nhận sai nếu có, độ trôi chảy, từ vựng, ngữ pháp, nội dung)',write:'bài VIẾT (nội dung, bố cục, từ vựng, ngữ pháp, chính tả, liên kết ý)'}[kind];
  const prompt=`Bạn là giáo viên tiếng Anh THPT tại Việt Nam. Hãy chấm ${guide} của học sinh trình độ mức ${lv}/3 (1 cơ bản, 2 trung bình, 3 nâng cao), thang điểm 10, chấm công bằng và nghiêm túc.\nĐề bài: ${task}\nBài làm: """${answer}"""\nChỉ trả về JSON hợp lệ dạng: {"score":số 0-10,"summary":"nhận xét tổng quát 1-2 câu bằng tiếng Việt","strengths":["..."],"errors":[{"original":"đoạn sai","fix":"sửa lại","why":"giải thích ngắn bằng tiếng Việt"}],"tips":["lời khuyên cải thiện bằng tiếng Việt"],"improved":"phiên bản viết lại tốt hơn (tiếng Anh)"}`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent?key=${encodeURIComponent(S.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.3}})});
    if(!res.ok){const t=await res.text();return {error:'Lỗi API '+res.status+': '+t.slice(0,160)}}
    const j=await res.json();const txt=j.candidates[0].content.parts[0].text;
    const o=JSON.parse(txt.replace(/^```json|```$/g,'').trim());o.score=Math.max(0,Math.min(10,Number(o.score)||0));return o;
  }catch(e){return {error:'Không gọi được AI: '+e.message}}
}
function aiHtml(a){

/* ============ Chấm điểm cục bộ (không cần mạng) ============ */
const CONN=['because','however','and','but','so','also','firstly','secondly','moreover','therefore','although','for example','in addition','finally','then','besides','while','which','who','if'];
const tok=s=>(s.toLowerCase().match(/[a-z']+/g)||[]);
function connCount(text){const t=' '+text.toLowerCase()+' ';return CONN.filter(c=>t.includes(' '+c+' ')||t.includes(' '+c+',')).length}
function lcsMatch(target,said){ // trả về mảng true/false cho từng từ của target
  const n=target.length,m=said.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=target[i-1]===said[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const ok=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(target[i-1]===said[j-1]){ok[i-1]=true;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return ok;
}
function gradeFreeText(text,item,lv,kind){
  const w=tok(text),n=w.length,fb=[];
  const target=kind==='write'?item.min:[25,40,60][lv-1];
  const lenS=Math.min(1,n/target);
  const uniq=new Set(w).size,varS=n?Math.min(1,(uniq/n)/0.62):0;
  const hits=item.kw.filter(k=>w.includes(k.toLowerCase())||text.toLowerCase().includes(k.toLowerCase())).length;
  const kwS=Math.min(1,hits/Math.min(item.kw.length,4));
  const cc=connCount(text),conS=Math.min(1,cc/(lv+1));
  let mech=1;
  if(kind==='write'){
    const sents=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
    const capBad=sents.filter(s=>/^[a-z]/.test(s.trim())).length;
    if(capBad){mech-=Math.min(.3,capBad*.08);fb.push(`Có ${capBad} câu không viết hoa chữ cái đầu.`)}
    if(/\bi\b/.test(text.replace(/[.!?]\s*i\b/g,''))&&/(^|[\s,])i(\s|'|,)/.test(text)){mech-=.15;fb.push('Đại từ "I" phải luôn viết hoa.')}
    if(text.trim()&&!/[.!?]$/.test(text.trim())){mech-=.1;fb.push('Câu cuối chưa có dấu chấm câu.')}
    const rep=text.match(/\b(\w+)\s+\1\b/i);if(rep){mech-=.1;fb.push(`Lặp từ "${rep[1]}" liên tiếp.`)}
    if(/ ,| \./.test(text)){mech-=.05;fb.push('Có khoảng trắng thừa trước dấu câu.')}
    const avg=sents.length?n/sents.length:0;
    if(lv>=2&&avg<8){mech-=.1;fb.push('Câu còn ngắn, hãy dùng câu ghép/câu phức (because, although, which...).')}
    if(lv>=3&&sents.length<5){fb.push('Bài nâng cao nên có mở bài, 2 ý chính và kết luận.')}
    mech=Math.max(0,mech);
  }
  let sc=kind==='write'?(.25*lenS+.15*varS+.2*kwS+.15*conS+.25*mech):(.35*lenS+.2*varS+.25*kwS+.2*conS);
  if(n<5)sc=Math.min(sc,.1);
  if(lenS<1)fb.unshift(`Độ dài: ${n}/${target} từ — hãy viết/nói dài hơn.`);else fb.unshift(`Độ dài tốt (${n} từ).`);
  fb.push(hits>=Math.min(item.kw.length,4)?'Bám sát chủ đề tốt.':`Dùng thêm từ khóa theo chủ đề: ${item.kw.slice(0,5).join(', ')}.`);
  fb.push(cc>=lv+1?'Dùng từ nối tốt.':'Dùng thêm từ nối (because, however, moreover, for example...).');
  if(varS<.7)fb.push('Từ vựng còn lặp, hãy đa dạng hóa từ ngữ.');
  return {score:sc,fb};
}

    if(said.length>t.length+3)fb.push('Bạn nói thừa từ so với câu mẫu.');
    fb.push('Lưu ý: điểm dựa trên việc máy nhận ra đúng từ bạn phát âm, nên phản ánh độ rõ ràng của phát âm.');
    html=resultCard(score*10,fb,`<p style="margin-top:10px">${marked}</p>`);
  }else{
    const g=gradeFreeText(text,it,it.lv,'speak');score=g.score;
    html=resultCard(score*10,g.fb,`<div id="aislot"><div class="ai mute">🤖 AI đang chấm...</div></div>`);
  }
  $('#sres').innerHTML=html;$('#sbtn').style.display='none';
  if(it.type==='talk'){
    const a=await aiGrade('speak',it.p,text,it.lv);
    if(a&&!a.error){score=(score+a.score/10)/2}
    $('#aislot').innerHTML=aiHtml(a);
  }
  record('speak',score);
  $('#sres').insertAdjacentHTML('beforeend','<button class="btn block" onclick="viewSpeak()">Bài nói tiếp theo</button>');
}

/* ============ Viết ============ */
let WQ=null;
function viewWrite(){
  const L=lvl('write');const it=pick(WRITE.filter(x=>x.lv===L),'write'+L);WQ={it};
  app(`<div class="card"><div class="row" style="justify-content:space-between"><h2>✍️ Bài viết</h2><span class="tag">${LVN[it.lv]}</span></div>
  <p style="font-weight:600">${esc(it.p)}</p><textarea id="wt" oninput="$('#wc').textContent=tok(this.value).length" placeholder="Viết bài của bạn bằng tiếng Anh..."></textarea>
  <div class="mute">Số từ: <span id="wc">0</span> / ${it.min}+</div><button class="btn block" id="wbtn" onclick="writeGrade()">Chấm điểm</button></div><div id="wres"></div>`);
}
async function writeGrade(){
  const it=WQ.it,text=$('#wt').value.trim();if(tok(text).length<5){toast('Bài viết quá ngắn');return}
  $('#wbtn').disabled=true;const g=gradeFreeText(text,it,it.lv,'write');
  $('#wres').innerHTML=resultCard(g.score*10,g.fb,`<div id="aislot"><div class="ai mute">🤖 AI đang chấm...</div></div>`);$('#wbtn').style.display='none';
  const a=await aiGrade('write',it.p,text,it.lv);let score=g.score;if(a&&!a.error)score=(score+a.score/10)/2;
  $('#aislot').innerHTML=aiHtml(a);record('write',score);
  $('#wres').insertAdjacentHTML('beforeend','<button class="btn block" onclick="viewWrite()">Đề tiếp theo</button>');
}

/* ============ Cài đặt ============ */
function openSettings(){
  const d=document.createElement('div');d.id='modal';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center';
  d.innerHTML=`<div class="card" style="width:100%;max-width:600px;margin:0;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto"><h2>⚙️ Cài đặt</h2>
  <label class="mute">Tên</label><input type="text" id="sn" value="${esc(S.name)}">
  <label class="mute" style="display:block;margin-top:10px">Khoá Gemini API (để AI chấm Nói/Viết chi tiết)</label><input type="password" id="sk" value="${esc(S.apiKey)}" placeholder="AIza...">
  <label class="mute" style="display:block;margin-top:10px">Mô hình</label><input type="text" id="sm" value="${esc(S.model)}">
  <p class="mute">Khoá chỉ lưu trên máy bạn và gửi thẳng đến Google khi chấm bài. Lấy khoá miễn phí tại aistudio.google.com/apikey. Không có khoá, app vẫn chấm bằng thuật toán trên máy.</p>
  <button class="btn block" onclick="saveSettings()">Lưu</button><button class="btn bad block" onclick="if(confirm('Xoá toàn bộ tiến độ học?')){localStorage.removeItem('thpt_english_ai');location.reload()}">Xoá dữ liệu học</button>
  <button class="btn sec block" onclick="$('#modal').remove()">Đóng</button></div>`;
  document.body.appendChild(d);
}
function saveSettings(){S.name=$('#sn').value.trim();S.apiKey=$('#sk').value.trim();S.model=$('#sm').value.trim()||'gemini-2.5-flash';save();$('#modal').remove();toast('Đã lưu');go(tab)}

/* ============ Khởi động ============ */
if('speechSynthesis' in window)speechSynthesis.getVoices();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
go('home');
</script>
